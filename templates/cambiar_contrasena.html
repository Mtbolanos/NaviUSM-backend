<!DOCTYPE html>
<html lang="es" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - NaviUSM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm border-0 bg-body p-4" style="border-radius: 1rem;">
                    <h4 class="fw-bold mb-4 text-center">Cambiar Contraseña</h4>
                    <form method="post" action="/cambiar-contrasena">
                        <div class="mb-3">
                            <label for="old_password" class="form-label small fw-bold">Contraseña actual</label>
                            <input type="password" class="form-control" id="old_password" name="old_password" required>
                        </div>
                        <div class="mb-4">
                            <label for="new_password" class="form-label small fw-bold">Nueva contraseña</label>
                            <input type="password" class="form-control" id="new_password" name="new_password" required>
                        </div>
                        <form method="post" action="{{ request.scope.get('root_path', '') }}/cambiar-contrasena">
                            <a href="{{ request.scope.get('root_path', '') }}/admin"
                                class="btn btn-outline-secondary w-100 py-2 mt-2 fw-bold">Volver al Editor</a>
                        </form>
                        {% if error %}
                        <div class="alert alert-danger mt-3 mb-0 small text-center">{{ error }}</div>
                        {% endif %}
                        {% if success %}
                        <div class="alert alert-success mt-3 mb-0 small text-center">{{ success }}</div>
                        {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>

</html>
