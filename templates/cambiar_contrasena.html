<!DOCTYPE html>
<html lang="es" data-theme="dark" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña - NaviUSM Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/admin.css') }}?v=0.9.3">
    <script src="{{ url_for('static', path='js/ui.js') }}?v=0.9.3"></script>
</head>

<body class="auth-page">
    <main class="auth-box">
        <div class="auth-brand">NaviUSM <sub>Studio</sub></div>
        <div class="nv-card auth-card">
            <h1 class="auth-title">Cambiar contraseña</h1>
            <form method="post" action="{{ request.scope.get('root_path', '') }}/cambiar-contrasena">
                <div class="mb-3">
                    <label for="old_password" class="form-label auth-label">Contraseña actual</label>
                    <input type="password" class="form-control" id="old_password" name="old_password" autocomplete="current-password" required>
                </div>
                <div class="mb-4">
                    <label for="new_password" class="form-label auth-label">Nueva contraseña</label>
                    <input type="password" class="form-control" id="new_password" name="new_password" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-accent w-100">Cambiar contraseña</button>
                <a href="{{ request.scope.get('root_path', '') }}/admin" class="btn btn-secondary w-100 mt-2">Volver al editor</a>
            </form>
            {% if error %}
            <div class="auth-msg auth-msg-error">{{ error }}</div>
            {% endif %}
            {% if success %}
            <div class="auth-msg auth-msg-ok">{{ success }}</div>
            {% endif %}
        </div>
    </main>
</body>

</html>
