<!DOCTYPE html>
<html lang="es" data-theme="dark" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - NaviUSM Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ asset('css/admin.css') }}">
    <script src="{{ asset('js/ui.js') }}"></script>
</head>

<body class="auth-page">
    <main class="auth-box">
        <div class="auth-brand">NaviUSM <sub>Studio</sub></div>
        <div class="nv-card auth-card">
            <h1 class="auth-title">Iniciar sesión</h1>
            <form method="post" action="{{ request.scope.get('root_path', '') }}/login">
                <div class="mb-3">
                    <label for="email" class="form-label auth-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" name="email" autocomplete="username" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label auth-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-accent w-100">Iniciar sesión</button>
            </form>
            {% if error %}
            <div class="auth-msg auth-msg-error">{{ error }}</div>
            {% endif %}
        </div>
    </main>
</body>

</html>
