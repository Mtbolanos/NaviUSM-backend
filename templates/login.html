<!DOCTYPE html>
<html lang="es" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - NaviUSM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        const updateTheme = () => {
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.setAttribute("data-bs-theme", prefersDark ? "dark" : "light");
        };
        updateTheme();
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateTheme);
    </script>
</head>

<body class="bg-body-tertiary d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold mb-0">Panel de Administración</h2>
                    <span class="text-body-secondary">NaviUSM</span>
                </div>
                <div class="card shadow-sm border-0 bg-body p-4" style="border-radius: 1rem;">
                    <form method="post" action="{{ request.scope.get('root_path', '') }}/login">
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-bold">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label small fw-bold">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Iniciar Sesión</button>
                    </form>
                    {% if error %}
                    <div class="alert alert-danger mt-3 mb-0 small text-center">{{ error }}</div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>

</html>
