{% extends "base.html" %}
{% block title %}<title>Gestión de Sedes - NaviUSM Studio</title>{% endblock %}
{% block content %}

<div class="page">
 <div class="page-inner">
  <div class="page-header">
    <h3>Sedes administradas</h3>
    <button class="btn btn-sm btn-accent" data-bs-toggle="modal" data-bs-target="#newSedeModal">+ Agregar sede</button>
  </div>

  <div class="row">
    {% for sede in sedes %}
    <div class="col-md-4 mb-3">
      <div class="nv-card h-100 d-flex flex-column">
        <div class="d-flex flex-column flex-grow-1">
          <h5 class="card-title-strong">{{ sede.nombre }}</h5>
          <p class="panel-meta">Lat: {{ sede.latitud }} | Lng: {{ sede.longitud }}</p>
          <button class="btn btn-sm btn-danger w-100 mt-auto" data-id="{{ sede.id }}" data-nombre="{{ sede.nombre }}"
            onclick="eliminarSede(this.dataset.id, this.dataset.nombre)">Eliminar sede</button>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
 </div>
</div>

<div class="modal fade" id="newSedeModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Crear nueva sede</h5>
      </div>
      <div class="modal-body p-0">
        <!-- Contenedor del Mapa y Buscador -->
        <div class="ns-map-wrap">
          <div class="ns-search">
            <div class="d-flex gap-2">
              <input type="text" id="ns-search" class="form-control form-control-sm shadow-sm"
                placeholder="Buscar dirección, universidad o lugar..."
                onkeydown="if(event.key==='Enter') searchLocation()">
              <button class="btn btn-sm btn-accent shadow-sm" onclick="searchLocation()">Buscar</button>
            </div>
            <div class="form-check form-switch mt-1 d-inline-flex align-items-center gap-2 ns-switch">
              <input class="form-check-input" type="checkbox" id="ns-solo-recintos" checked>
              <label class="form-check-label" for="ns-solo-recintos">Solo recintos (sin calles ni direcciones)</label>
            </div>
            <!-- Div de resultados de búsqueda -->
            <div id="ns-search-results" class="list-group shadow mt-1 ns-results" hidden></div>
          </div>
          <div id="ns-map" class="ns-map"></div>
        </div>

        <div class="p-3 pb-2">
          <label class="form-label panel-label" for="ns-nombre">Nombre de la sede</label>
          <input type="text" class="form-control" id="ns-nombre" placeholder="Ej: Sede Concepción">
        </div>
      </div>
      <div class="modal-footer d-flex justify-content-between align-items-center">
        <div class="ns-coords">
          <span id="ns-lat-disp">-33.036577</span>, <span id="ns-lng-disp">-71.486578</span>
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-sm btn-accent" onclick="submitNuevaSede()">Crear sede</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="{{ asset('js/gestion_sedes.js') }}"></script>
{% endblock %}
