<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %}<title>NaviUSM Studio</title>{% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/admin.css') }}?v=0.3.1">
</head>

<body>
    <nav class="navbar navbar-expand navbar-dark navbar-custom px-3">
        <a class="navbar-brand me-4" href="{{ request.scope.get('root_path', '') }}/admin">NaviUSM <sub>Studio</sub></a>
        <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="main-navbar" style="font-size: 13px; font-weight: 600;">
            <li class="nav-item"><a class="nav-link" href="{{ request.scope.get('root_path', '') }}/admin">Dibujar
                    Mapa</a></li>
            <li class="nav-item"><a class="nav-link"
                    href="{{ request.scope.get('root_path', '') }}/admin/edificios">Gestión Edificios</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ request.scope.get('root_path', '') }}/admin/sedes">Gestión
                    Sedes</a></li>
        </ul>
        <div class="ms-auto d-flex align-items-center">
            <div class="dropdown">
                <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" role="button"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    <div
                        style="width: 28px; height: 28px; background: var(--naviusm-accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; font-size: 12px;">
                        {{ user.email[0].upper() }}
                    </div>
                    <span class="d-none d-md-inline" style="font-size: 13px;">{{ user.email }}</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow">
                    <li>
                        <h6 class="dropdown-header">Rol: {{ user.rol.capitalize() }}</h6>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item"
                            href="{{ request.scope.get('root_path', '') }}/cambiar-contrasena">Cambiar
                            Contraseña</a></li>
                    <li><a class="dropdown-item text-danger"
                            href="{{ request.scope.get('root_path', '') }}/logout">Cerrar
                            Sesión</a></li>
                </ul>
            </div>
    </nav>
    {% block content %}{% endblock %}

    <!-- Modal Base para Alertas y Confirmaciones (Inyección Global) -->
    <div class="modal fade" id="uiCustomModal" tabindex="-1" aria-hidden="true" style="z-index: 10000;">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content"
                style="background: var(--naviusm-surface); border: 1px solid var(--naviusm-border);">
                <div class="modal-header border-0 pb-0">
                    <h6 class="modal-title fw-bold" id="uiModalTitle">Atención</h6>
                </div>
                <div class="modal-body pb-0" id="uiModalBody" style="font-size: 13px; color: var(--naviusm-text);">
                </div>
                <div class="modal-footer border-0 pt-3">
                    <button type="button" class="btn btn-sm btn-secondary" id="uiModalCancel"
                        data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-sm btn-primary" id="uiModalConfirm"
                        style="background:var(--naviusm-accent); color:black; border:none; font-weight:bold;">Aceptar</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        window.createDynamicModal = function (message, title, showCancel) {
            return new Promise((resolve) => {
                const modalId = 'ui-modal-' + Math.random().toString(36).substring(2, 10);
                const html = `
                <div class="modal fade" id="${modalId}" tabindex="-1" aria-hidden="true" style="z-index: 10500;">
                    <div class="modal-dialog modal-dialog-centered modal-sm">
                        <div class="modal-content" style="background: var(--naviusm-surface); border: 1px solid var(--naviusm-border);">
                            <div class="modal-header border-0 pb-0">
                                <h6 class="modal-title fw-bold">${title}</h6>
                            </div>
                            <div class="modal-body pb-0" style="font-size: 13px; color: var(--naviusm-text);">
                                ${message.replace(/\n/g, '<br>')}
                            </div>
                            <div class="modal-footer border-0 pt-3">
                                ${showCancel ? `<button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>` : ''}
                                <button type="button" class="btn btn-sm btn-primary btn-confirm" style="background:var(--naviusm-accent); color:black; border:none; font-weight:bold;">Aceptar</button>
                            </div>
                        </div>
                    </div>
                </div>`;

                document.body.insertAdjacentHTML('beforeend', html);
                const modalEl = document.getElementById(modalId);
                const modal = new bootstrap.Modal(modalEl);
                let resolved = false;

                modalEl.querySelector('.btn-confirm').addEventListener('click', () => {
                    resolved = true;
                    resolve(true);
                    modal.hide();
                });

                modalEl.addEventListener('hidden.bs.modal', () => {
                    if (!resolved) resolve(false);
                    modalEl.remove(); // Limpieza absoluta del DOM al cerrar
                });

                modal.show();
            });
        };

        window.uiConfirm = (msg, title = "Confirmar acción") => window.createDynamicModal(msg, title, true);
        window.uiAlert = (msg, title = "Aviso") => window.createDynamicModal(msg, title, false);
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const currentPath = window.location.pathname.replace(/\/$/, "");
            document.querySelectorAll('#main-navbar .nav-link').forEach(link => {
                link.classList.remove('active');
                const linkPath = new URL(link.href).pathname.replace(/\/$/, "");
                if (currentPath === linkPath) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>

</html>
