<!DOCTYPE html>
<html lang="es" data-theme="dark" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %}<title>NaviUSM Studio</title>{% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/admin.css') }}?v=0.9.3">
    <script type="application/json" id="site-config">{{ {"rootPath": request.scope.get('root_path', ''), "mapTiles": map_tiles if map_tiles is defined else none} | tojson }}</script>
    <script src="{{ url_for('static', path='js/ui.js') }}?v=0.9.3"></script>
</head>

<body>
    <nav class="navbar navbar-expand navbar-custom px-3">
        <a class="navbar-brand me-4" href="{{ request.scope.get('root_path', '') }}/admin">NaviUSM <sub>Studio</sub></a>
        <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="main-navbar">
            <li class="nav-item"><a class="nav-link" href="{{ request.scope.get('root_path', '') }}/admin">Dibujar
                    Mapa</a></li>
            <li class="nav-item"><a class="nav-link"
                    href="{{ request.scope.get('root_path', '') }}/admin/edificios">Gestión Edificios</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ request.scope.get('root_path', '') }}/admin/sedes">Gestión Sedes</a></li>
        </ul>
        <div class="ms-auto d-flex align-items-center">
            <div class="dropdown">
                <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" role="button"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    <div class="user-avatar">{{ user.email[0].upper() }}</div>
                    <span class="d-none d-md-inline user-email">{{ user.email }}</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow">
                    <li>
                        <h6 class="dropdown-header">Rol: {{ user.rol.capitalize() }}</h6>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item" href="{{ request.scope.get('root_path', '') }}/admin/api-keys">API Keys</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li>
                        <h6 class="dropdown-header">Tema</h6>
                    </li>
                    <li><button type="button" class="dropdown-item theme-opt" data-theme-pref="system">Según el sistema</button></li>
                    <li><button type="button" class="dropdown-item theme-opt" data-theme-pref="light">Claro</button></li>
                    <li><button type="button" class="dropdown-item theme-opt" data-theme-pref="dark">Oscuro</button></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item"
                            href="{{ request.scope.get('root_path', '') }}/cambiar-contrasena">Cambiar
                            Contraseña</a></li>
                    <li><a class="dropdown-item text-danger"
                            href="{{ request.scope.get('root_path', '') }}/logout">Cerrar
                            Sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>
    {% block content %}{% endblock %}
</body>

</html>
