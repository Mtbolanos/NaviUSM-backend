<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NaviUSM — Navegación</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/naviusm/static/css/mobile.css">
</head>

<body>

  <div class="outer">
    <div class="app-label">NaviUSM · Beta</div>

    <div class="phone">
      <div class="notch">
        <div class="spk"></div>
        <div class="cam"></div>
      </div>
      <div class="status-bar">
        <span class="time" id="clock">9:41</span>
        <div class="icons"><span>●●●</span><span>WiFi</span><span>🔋</span></div>
      </div>

      <div class="screen-wrap">
        <div id="s-map" class="screen active">
          <div class="map-topbar">
            <div class="topbar-row">
              <div class="sede-pill">
                <div class="dot"></div> Viña del Mar
              </div>
            </div>
            <div class="search-pill" onclick="focusSearchInput()">
              <span>🔍</span>
              <input id="s-input-inline" type="text" placeholder="Sala, edificio, servicio…" autocomplete="off"
                autocorrect="off" autocapitalize="off" spellcheck="false" oninput="onSearchInput(this.value)"
                onfocus="onSearchFocus()">
              <span class="search-clear" id="search-clear" onclick="clearSearchInput(event)"
                style="display:none">✕</span>
            </div>
            <div class="search-results" id="search-results"></div>
          </div>

          <div id="map"></div>

          <div class="bottom-sheet">
            <div class="sheet-handle"></div>
            <div class="filter-chips" id="filter-chips">
              <div class="fchip on" onclick="filterChip(this,'todo')">🏫 Todo</div>
              <div class="fchip" onclick="filterChip(this,'building')">🏛️ Edificios</div>
              <div class="fchip" onclick="filterChip(this,'entrance')">🚪 Entradas</div>
              <div class="fchip" onclick="filterChip(this,'baño')">🚽 Baños</div>
              <div class="fchip" onclick="filterChip(this,'seguridad')">👮🏻 Seguridad</div>
            </div>
            <div class="bcard" id="bcard">
              <div class="bcard-ico" id="bcard-ico">🏛️</div>
              <div class="bcard-txt">
                <h4 id="bcard-name">—</h4>
                <p id="bcard-desc">—</p>
              </div>
              <div class="bcard-actions">
                <button class="btn-sm btn-route" onclick="routeTo()">Ir →</button>
              </div>
            </div>
          </div>
        </div>

        <div id="s-route" class="screen">
          <div class="route-header">
            <div class="back-row" onclick="go('s-map');clearRoute()">← Volver</div>
            <div class="route-dest" id="r-dest">Destino</div>
            <div class="route-meta">
              <span>🚶 <span id="r-dist">—</span></span>
              <span>⏱ <span id="r-time">—</span></span>
            </div>
          </div>
          <div id="route-map"></div>
          <div class="steps-panel">
            <div class="steps-title">Instrucciones</div>
            <div id="steps-list"></div>
            <button class="arrive-btn" onclick="arrive()">✅ ¡Llegué!</button>
          </div>
        </div>

        <div class="toast" id="toast-el"></div>

      </div>
    </div>

    <div class="mockup-footer" style="font-size:10px;color:rgba(255,255,255,0.18);text-align:center;line-height:1.8">
      NaviUSM · A* pathfinding local · OSM tiles · Sin OSRM
    </div>
  </div>

  <script>
    window.APP_CONFIG = {
      sedeId: "{{ sede_id }}",
      rootPath: "{{ request.scope.get('root_path', '') }}"
    };
  </script>
  <script src="/naviusm/static/js/mobile.js?v=0.0.1"></script>
</body>

</html>
